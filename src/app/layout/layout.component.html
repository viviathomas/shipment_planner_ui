<div class="container">

  <aside class="sidebar" [class.collapsed]="collapsed">
    <div class="sidebar-header">
      <h2 *ngIf="!collapsed">Logistics Control</h2>
      <button class="toggle-btn" (click)="toggleSidebar()">
        {{ collapsed ? '▶' : '◀' }}
      </button>
    </div>

    <nav *ngIf="!collapsed">
      <a routerLink="/unified" routerLinkActive="active">Unified Control</a>
      <a routerLink="/optimization" routerLinkActive="active">Optimization Settings</a>
      <a routerLink="/shipments" routerLinkActive="active">Shipments</a>
    </nav>

    <div class="lanes-section" *ngIf="!collapsed">
      <h3>Lanes</h3>
      <div *ngIf="lanes.length === 0">No lanes loaded</div>
      <ul *ngIf="lanes.length > 0">
        <li *ngFor="let l of lanes">
          <strong>{{ l.laneId }}</strong><br />
          cost: {{ l.baseCost }} | dist: {{ l.distance }}
        </li>
      </ul>
    </div>

  </aside>

  <main class="content">
    <router-outlet></router-outlet>
  </main>

</div>
