<div class="container">

  <aside class="sidebar" [class.collapsed]="collapsed">
    <div class="sidebar-header">
      <h2 *ngIf="!collapsed">Logistics Control</h2>
      <button class="toggle-btn" (click)="toggleSidebar()">
        {{ collapsed ? '▶' : '◀' }}
      </button>
    </div>

    <nav *ngIf="!collapsed">
      <a routerLink="/unified" routerLinkActive="active">Unified Control</a>
      <a routerLink="/optimization" routerLinkActive="active">Optimization Settings</a>
      <a routerLink="/shipments" routerLinkActive="active">Shipments</a>
      <a routerLink="/lanes" routerLinkActive="active">Lanes</a>
      <a routerLink="/orphan-orders" routerLinkActive="active">Orphan Orders</a>
    </nav>
  </aside>

  <main class="content">
    <div class="page-wrapper">
      <router-outlet></router-outlet>
    </div>
  </main>

</div>
